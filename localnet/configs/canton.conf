canton {
  # Two synchronizers: global-sync simulates the Global Synchronizer, and private-sync is a private domain
  sequencers {
    # Sequencer for the global synchronizer
    sequencer-global {
      storage.type = memory
      public-api.address = 0.0.0.0
      public-api.port = 5108
      admin-api.address = 0.0.0.0
      admin-api.port = 5109
    }

    # Sequencer for the private synchronizer
    sequencer-private {
      storage.type = memory
      public-api.address = 0.0.0.0
      public-api.port = 5208
      admin-api.address = 0.0.0.0
      admin-api.port = 5209
    }
  }

  mediators {
    mediator-global {
      storage.type = memory
      admin-api.address = 0.0.0.0
      admin-api.port = 5107
    }

    mediator-private {
      storage.type = memory
      admin-api.address = 0.0.0.0
      admin-api.port = 5207
    }
  }

  participants {
    # Connected only to the global synchronizer
    participant-global {
      storage.type = memory
      ledger-api.address = 0.0.0.0
      ledger-api.port = 5011
      admin-api.address = 0.0.0.0
      admin-api.port = 5012
      http-ledger-api.address = 0.0.0.0
      http-ledger-api.port = 5013
    }

    # Connected only to the private synchronizer
    participant-private {
      storage.type = memory
      ledger-api.address = 0.0.0.0
      ledger-api.port = 5021
      admin-api.address = 0.0.0.0
      admin-api.port = 5022
      http-ledger-api.address = 0.0.0.0
      http-ledger-api.port = 5023
    }

    # Shared participant: connected to both the global and private synchronizers
    participant-shared {
      storage.type = memory
      ledger-api.address = 0.0.0.0
      ledger-api.port = 5031
      # HMAC audience token for the local demo. Do not use this secret in any shared environment.
      ledger-api.auth-services = [{
        type = unsafe-jwt-hmac-256
        secret = ${LEDGER_API_JWT_SECRET}
        target-audience = ${LEDGER_API_JWT_AUDIENCE}
        # Local demo: treat this audience token as an administrator. Do not use it in a shared environment.
        privileged = true
      }]
      admin-api.address = 0.0.0.0
      admin-api.port = 5032
      http-ledger-api.address = 0.0.0.0
      http-ledger-api.port = 5033
    }
  }
}
