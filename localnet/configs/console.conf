canton {
  features.enable-testing-commands = yes

  # Remote references to nodes running inside the canton container
  remote-sequencers {
    sequencer-global {
      public-api.address = canton
      public-api.port = 5108
      admin-api.address = canton
      admin-api.port = 5109
    }
    sequencer-private {
      public-api.address = canton
      public-api.port = 5208
      admin-api.address = canton
      admin-api.port = 5209
    }
  }

  remote-mediators {
    mediator-global {
      admin-api.address = canton
      admin-api.port = 5107
    }
    mediator-private {
      admin-api.address = canton
      admin-api.port = 5207
    }
  }

  remote-participants {
    participant-global {
      ledger-api.address = canton
      ledger-api.port = 5011
      admin-api.address = canton
      admin-api.port = 5012
    }
    participant-private {
      ledger-api.address = canton
      ledger-api.port = 5021
      admin-api.address = canton
      admin-api.port = 5022
    }
    participant-shared {
      ledger-api.address = canton
      ledger-api.port = 5031
      admin-api.address = canton
      admin-api.port = 5032
    }
  }
}
