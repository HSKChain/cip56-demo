syntax = "proto3";

// Keep only the field numbers required for hashing. They match the Canton 3.4 PreparedTransaction wire format.
message Empty {}

message Identifier {
  string package_id = 1;
  string module_name = 2;
  string entity_name = 3;
}

message Value {
  oneof sum {
    Empty unit = 1;
    bool bool = 2;
    sint64 int64 = 3;
    int32 date = 4;
    sfixed64 timestamp = 5;
    string numeric = 6;
    string party = 7;
    string text = 8;
    string contract_id = 9;
    Optional optional = 10;
    List list = 11;
    TextMap text_map = 12;
    GenMap gen_map = 13;
    Record record = 14;
    Variant variant = 15;
    Enum enum = 16;
  }
}

message Record {
  Identifier record_id = 1;
  repeated RecordField fields = 2;
}

message RecordField {
  string label = 1;
  Value value = 2;
}

message Variant {
  Identifier variant_id = 1;
  string constructor = 2;
  Value value = 3;
}

message Enum {
  Identifier enum_id = 1;
  string constructor = 2;
}

message List {
  repeated Value elements = 1;
}

message Optional {
  Value value = 1;
}

message TextMap {
  message Entry {
    string key = 1;
    Value value = 2;
  }
  repeated Entry entries = 1;
}

message GenMap {
  message Entry {
    Value key = 1;
    Value value = 2;
  }
  repeated Entry entries = 1;
}

message CreateNode {
  string lf_version = 1;
  string contract_id = 2;
  string package_name = 3;
  Identifier template_id = 4;
  Value argument = 5;
  repeated string signatories = 6;
  repeated string stakeholders = 7;
}

message FetchNode {
  string lf_version = 1;
  string contract_id = 2;
  string package_name = 3;
  Identifier template_id = 4;
  repeated string signatories = 5;
  repeated string stakeholders = 6;
  repeated string acting_parties = 7;
  Identifier interface_id = 8;
}

message ExerciseNode {
  string lf_version = 1;
  string contract_id = 2;
  string package_name = 3;
  Identifier template_id = 4;
  repeated string signatories = 5;
  repeated string stakeholders = 6;
  repeated string acting_parties = 7;
  Identifier interface_id = 8;
  string choice_id = 9;
  Value chosen_value = 10;
  bool consuming = 11;
  repeated string children = 12;
  Value exercise_result = 13;
  repeated string choice_observers = 14;
}

message RollbackNode {
  repeated string children = 1;
}

message VersionedNode {
  oneof node_type {
    CreateNode create = 1;
    FetchNode fetch = 2;
    ExerciseNode exercise = 3;
    RollbackNode rollback = 4;
  }
}

message TransactionNode {
  string node_id = 1;
  VersionedNode v1 = 1000;
}

message NodeSeed {
  int32 node_id = 1;
  bytes seed = 2;
}

message DamlTransaction {
  string version = 1;
  repeated string roots = 2;
  repeated TransactionNode nodes = 3;
  repeated NodeSeed node_seeds = 4;
}

message SubmitterInfo {
  repeated string act_as = 1;
  string command_id = 2;
}

message InputContract {
  CreateNode v1 = 1;
  uint64 created_at = 1000;
  bytes event_blob = 1002;
}

message Metadata {
  SubmitterInfo submitter_info = 2;
  string synchronizer_id = 3;
  uint32 mediator_group = 4;
  string transaction_uuid = 5;
  uint64 preparation_time = 6;
  repeated InputContract input_contracts = 7;
  optional uint64 min_ledger_effective_time = 9;
  optional uint64 max_ledger_effective_time = 10;
  optional uint64 max_record_time = 11;
}

message PreparedTransaction {
  DamlTransaction transaction = 1;
  Metadata metadata = 2;
}
